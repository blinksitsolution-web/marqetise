server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    charset utf-8;
    sendfile off;

    root /var/www/site;
    index index.html;

    error_log /dev/stderr info;
    access_log /dev/stdout;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI /up;
        fastcgi_pass 127.0.0.1:9000;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
    }

    location /sanctum/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /robots.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /about { try_files /page-about.html =404; }
    location = /services { try_files /page-services.html =404; }
    location = /courses { try_files /page-courses.html =404; }
    location = /contact { try_files /page-contact.html =404; }
    location = /book { try_files /page-book.html =404; }
    location = /privacy { try_files /page-privacy.html =404; }
    location = /terms { try_files /page-terms.html =404; }

    location ~ ^/courses/([A-Za-z0-9_-]+)$ {
        rewrite ^ /page-course-details.html last;
    }

    location /admin {
        try_files /admin.html =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|webp|svg|woff|woff2|ttf|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
